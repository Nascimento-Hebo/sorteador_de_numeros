<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="style.css">
    <title>Selecionador de números</title>
</head>

<body>

    <section>
        <img src="./assets/imagen-dado.png" alt="imagem de dado" width="140px">
        <h1>Sorteador de <span>Números</span></h1>
        <p class="inf">Informe o intervalo e clique em sortear</p>
        <div class="container">
            <label>
                <p>Número mínimo</p>
                <input type="number" id="input-min">
            </label>

            <div class="conj">
                <p>até</p>
            </div>

            <label>
                <p>Número máximo</p>
                <input type="number" id="input-max">
            </label>
        </div>

        <div class="contador">
            <p id="result">78</p>
        </div>

        <button>Sorteador de número</button>
    </section>

</body>

</html>
